<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ponto da equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#2B2B2B;          /* grafite do logotipo IBGP */
    --bg:#F3F1EC;           /* fundo claro, neutro quente */
    --card:#FFFFFF;         /* papel do cartão de ponto */
    --card-line:#E6E2D8;    /* linhas de pauta do cartão */
    --paper-text:#2B2B2B;   /* texto sobre o cartão */
    --teal:#B23A2E;         /* vermelho IBGP — cor de ação principal */
    --teal-dark:#8A2A20;    /* vermelho escurecido — sombra/hover */
    --amber:#B23A2E;
    --amber-dark:#8A2A20;
    --rust:#8A2A20;
    --stamp-green:#3C5A44;  /* verde tinta — confirmações */
    --line:#E6E2D8;
    --muted:#8A857A;
    --text-on-dark:#F3F1EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .stamp-font{font-family:'Special Elite',monospace;}
  .wrap{max-width:980px;margin:0 auto;padding:24px 20px 60px;}
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;background:var(--ink);color:var(--text-on-dark);
    border-radius:6px;margin-bottom:24px;flex-wrap:wrap;gap:12px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
  }
  header .brand{
    display:flex;align-items:center;gap:10px;
    font-family:'Special Elite',monospace;letter-spacing:.04em;font-size:14px;
    text-transform:uppercase;color:var(--text-on-dark);
  }
  header .brand img{height:28px;width:auto;display:block;}
  header .clock{font-family:'Special Elite',monospace;font-size:20px;letter-spacing:.02em;}
  header .who{font-size:13px;color:#C9C4B8;cursor:pointer;text-decoration:underline;}

  /* Cartão de ponto: papel com borda perfurada no topo */
  .card{
    background:var(--card);color:var(--paper-text);
    border:1px solid var(--card-line);border-radius:6px;
    padding:26px 22px 22px;position:relative;
    box-shadow:0 6px 18px rgba(43,43,43,.08);
  }
  .card::before{
    content:"";position:absolute;top:0;left:16px;right:16px;height:10px;
    background-image:radial-gradient(circle, var(--bg) 3.5px, transparent 3.6px);
    background-size:18px 10px;background-repeat:repeat-x;background-position:top center;
  }
  .punch-zone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;}
  .punch-btn{
    width:170px;height:170px;border-radius:50%;border:5px solid var(--teal-dark);
    background:linear-gradient(180deg, #C24638, var(--teal));
    color:#FFF3EE;font-family:'Special Elite',monospace;
    font-size:14px;font-weight:400;text-transform:uppercase;letter-spacing:.04em;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 0 var(--teal-dark), 0 10px 20px rgba(43,43,43,.18);
    transition:transform .08s, box-shadow .08s;padding:10px;
  }
  .punch-btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--teal-dark);}
  .punch-btn.done{background:var(--muted);border-color:#6b6558;box-shadow:0 6px 0 #6b6558;cursor:default;color:#F3F1EC;}
  .punch-btn.saida{background:linear-gradient(180deg,#7A2318,var(--teal-dark));border-color:#5C1B12;box-shadow:0 6px 0 #5C1B12;color:#FFF3EE;}
  .punch-btn.saida:active{box-shadow:0 0 0 #5C1B12;}
  .stamp{font-size:13px;color:var(--muted);min-height:18px;font-style:italic;}
  .timeline{width:100%;text-align:left;margin-top:6px;}
  .timeline h3{font-family:'Special Elite',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:400;}
  .tl-item{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--card-line);}
  .tl-item:last-child{border-bottom:none;}
  .tl-item .time{font-family:'IBM Plex Mono',monospace;color:var(--stamp-green);font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-family:'Special Elite',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--card-line);font-weight:400;}
  td{padding:10px 8px;border-bottom:1px dashed var(--card-line);}
  td.mono, th.mono{font-family:'IBM Plex Mono',monospace;}
  .status-pill{display:inline-block;padding:2px 9px;border-radius:3px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
  .p-working{background:#DCE6DD;color:var(--stamp-green);}
  .p-break{background:#F3DCD6;color:var(--teal-dark);}
  .p-done{background:#E9E6DC;color:var(--muted);}
  .p-notstarted{background:#F3D6D1;color:var(--rust);}
  .section-title{font-family:'Special Elite',monospace;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400;margin:0 0 14px;}
  .id-screen{max-width:420px;margin:60px auto;text-align:center;}
  .id-screen h1{font-family:'Special Elite',monospace;font-size:24px;margin-bottom:6px;color:var(--ink);letter-spacing:.02em;}
  .id-screen p{color:var(--muted);font-size:14px;margin-bottom:22px;}
  select,input{width:100%;padding:10px 12px;border:1px solid var(--card-line);border-radius:4px;font-size:14px;font-family:inherit;margin-bottom:10px;background:#fff;color:var(--paper-text);}
  .btn{width:100%;padding:11px;border-radius:4px;border:none;background:var(--teal);color:#FFF3EE;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.02em;}
  .btn:hover{background:var(--teal-dark);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--card-line);}
  .btn.secondary:hover{background:#F3F1EC;}
  .divider{color:var(--muted);font-size:12px;margin:16px 0;}
  .hint{font-size:12px;color:var(--muted);margin-top:16px;}
  .empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;}
  .admin-link{font-size:13px;color:#E8A99E;cursor:pointer;text-decoration:underline;}
  .row-actions{display:flex;gap:12px;align-items:center;}
  .icon-btn{background:none;border:none;color:var(--rust);cursor:pointer;font-size:13px;padding:0;font-family:inherit;line-height:1;vertical-align:middle;text-decoration:underline;}
  .icon-btn.neutral{color:var(--muted);}
  .admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .inline-form{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .inline-form input, .inline-form select{margin-bottom:0;flex:1;min-width:140px;}
  .inline-form button{width:auto;padding:10px 16px;white-space:nowrap;}
  .admin-section{margin-bottom:28px;}
  .err{color:var(--rust);font-size:13px;margin:-4px 0 12px;min-height:16px;}
  .void-note{color:var(--rust);font-style:italic;font-size:12px;}
  .corr-note{color:var(--amber-dark);font-size:11px;}
  .export-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .export-row button{width:auto;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ===== CONFIGURAÇÃO DO FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDvxIf-aLIVVIbTiEcd1MIU7LMZYtKhYXE",
  authDomain: "registro-de-ponto-2a062.firebaseapp.com",
  projectId: "registro-de-ponto-2a062",
  storageBucket: "registro-de-ponto-2a062.firebasestorage.app",
  messagingSenderId: "962067504394",
  appId: "1:962067504394:web:62017a50a9208a255aeef3"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(e=>console.error(e));
// ===== FIM DA CONFIGURAÇÃO =====

const app = document.getElementById('app');
const ADMIN_NAMES = ['Marcela Avelar', 'Laryssa Fulgêncio'];

const TYPES = {
  entrada: 'Entrada',
  inicio_intervalo: 'Início do almoço',
  fim_intervalo: 'Fim do almoço',
  saida: 'Saída'
};
const NEXT_ACTION = { none:'entrada', entrada:'inicio_intervalo', inicio_intervalo:'fim_intervalo', fim_intervalo:'saida', saida:null };
const BTN_LABEL = { entrada:'Bater entrada', inicio_intervalo:'Iniciar almoço', fim_intervalo:'Encerrar almoço', saida:'Bater saída' };

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtClock(){ return new Date().toLocaleTimeString('pt-BR'); }
function fmtDatePretty(){ return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}); }

// ===== IDENTIDADE / AUTENTICAÇÃO =====
function slugify(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,'.').replace(/[^a-z0-9.]/g,'');
}
function emailFor(name){ return slugify(name)+'@ponto-equipe.local'; }
function pinToPassword(pin){ return 'pt-'+pin; }

function getSecondaryAuth(){
  let secApp;
  try{ secApp = firebase.app('Secondary'); }
  catch(e){ secApp = firebase.initializeApp(firebaseConfig, 'Secondary'); }
  return secApp.auth();
}

let currentUser = null; // nome de exibição da pessoa autenticada nesta sessão
function getMyName(){ return currentUser; }
function setMyName(name){ currentUser = name; }

async function getEmployees(){
  try{
    const snap = await db.collection('employees').where('active','==',true).get();
    return snap.docs.map(d=>({ uid:d.id, name:d.data().name })).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  }catch(e){ console.error(e); return []; }
}
async function addEmployee(name, pin){
  const email = emailFor(name);
  const auth2 = getSecondaryAuth();
  const cred = await auth2.createUserWithEmailAndPassword(email, pinToPassword(pin));
  const uid = cred.user.uid;
  try{ await auth2.signOut(); }catch(e){}
  await db.collection('employees').doc(uid).set({ name, active:true });
  return uid;
}
async function deactivateEmployee(uid){
  await db.collection('employees').doc(uid).set({ active:false }, { merge:true });
}
async function signInEmployee(name, pin){
  await auth.signInWithEmailAndPassword(emailFor(name), pinToPassword(pin));
}

async function adminHasAccount(name){
  try{
    const methods = await auth.fetchSignInMethodsForEmail(emailFor(name));
    return methods && methods.length>0;
  }catch(e){ console.error(e); return false; }
}
async function createAdminAccount(name, pin){
  const cred = await auth.createUserWithEmailAndPassword(emailFor(name), pinToPassword(pin));
  await db.collection('admins').doc(cred.user.uid).set({ name });
  return cred.user;
}
async function signInAdmin(name, pin){
  await auth.signInWithEmailAndPassword(emailFor(name), pinToPassword(pin));
}

// ===== REGISTROS DE PONTO =====
async function getPunches(dateKey){
  try{
    const snap = await db.collection('punches').doc(dateKey).collection('entries').orderBy('time').get();
    return snap.docs.map(d=>{
      const v = d.data();
      return {
        id: d.id,
        name: v.name,
        uid: v.uid || null,
        type: v.type,
        time: (v.time && v.time.toDate) ? v.time.toDate().toISOString() : v.time,
        void: !!v.void,
        voidReason: v.voidReason || null,
        addedByAdmin: !!v.addedByAdmin,
        reason: v.reason || null
      };
    });
  }catch(e){ console.error(e); return []; }
}
async function addOwnPunch(dateKey, name, type){
  await db.collection('punches').doc(dateKey).collection('entries').add({
    name, uid: auth.currentUser.uid, type,
    time: firebase.firestore.FieldValue.serverTimestamp(),
    void: false
  });
}
async function addAdminCorrection(dateKey, name, uid, type, isoTime, reason){
  await db.collection('punches').doc(dateKey).collection('entries').add({
    name, uid: uid || null, type,
    time: firebase.firestore.Timestamp.fromDate(new Date(isoTime)),
    void: false,
    addedByAdmin: true,
    reason: reason || ''
  });
}
async function voidEntry(dateKey, entryId, reason){
  await db.collection('punches').doc(dateKey).collection('entries').doc(entryId).update({
    void: true,
    voidReason: reason || '',
    voidedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
async function listPunchDates(){
  try{
    const snap = await db.collectionGroup('entries').get();
    const set = new Set();
    snap.docs.forEach(d=>{ set.add(d.ref.parent.parent.id); });
    const dates = [...set];
    dates.sort((a,b)=> b.localeCompare(a));
    return dates;
  }catch(e){ console.error(e); return []; }
}

function hoursBetween(startIso, endIso){ return (new Date(endIso) - new Date(startIso)) / 3600000; }
function fmtHours(h){
  if(h == null || isNaN(h)) return '—';
  const hh = Math.floor(h);
  const mm = Math.round((h-hh)*60);
  return hh+'h'+String(mm).padStart(2,'0');
}
function computeStatus(punches, name){
  const mine = punches.filter(p=>p.name===name && !p.void).sort((a,b)=>new Date(a.time)-new Date(b.time));
  const last = mine.length ? mine[mine.length-1] : null;
  return { mine, lastType: last ? last.type : 'none' };
}
function computeWorked(mine){
  const byType = {};
  mine.forEach(p=>{ byType[p.type]=p.time; });
  if(!byType.entrada) return null;
  const end = byType.saida || new Date().toISOString();
  let total = hoursBetween(byType.entrada, end);
  if(byType.inicio_intervalo && byType.fim_intervalo){
    total -= hoursBetween(byType.inicio_intervalo, byType.fim_intervalo);
  } else if(byType.inicio_intervalo && !byType.fim_intervalo){
    total -= hoursBetween(byType.inicio_intervalo, new Date().toISOString());
  }
  return total;
}

// ===== EXPORTAÇÃO CSV =====
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportMonthlySummaryCSV(monthKey, totals){
  const rows = [['Colaborador','Total de horas (mês '+monthKey+')']];
  Object.keys(totals).sort((a,b)=>totals[b]-totals[a]).forEach(n=> rows.push([n, fmtHours(totals[n])]));
  downloadCSV('resumo-mensal-'+monthKey+'.csv', rows);
}
function exportDetailedCSV(monthKey, allPunches){
  const rows = [['Data','Colaborador','Tipo','Horário','Status','Observação']];
  Object.keys(allPunches).filter(d=>d.startsWith(monthKey)).sort().forEach(d=>{
    allPunches[d].forEach(p=>{
      const status = p.void ? 'Anulado' : (p.addedByAdmin ? 'Correção manual' : 'Normal');
      rows.push([d, p.name, TYPES[p.type]||p.type, fmtTime(p.time), status, p.voidReason||p.reason||'']);
    });
  });
  downloadCSV('registros-detalhados-'+monthKey+'.csv', rows);
}

// ===== TELA INICIAL (LOGIN) =====
async function renderStartScreen(startTab){
  const tab = startTab || 'colab';
  app.innerHTML = `
    <div class="id-screen">
      <h1>Ponto da equipe</h1>
      <p>Identifique-se para continuar.</p>
      <div class="inline-form" style="justify-content:center;margin-bottom:20px;">
        <button class="btn" id="tabColab" style="width:auto;background:${tab==='colab'?'var(--teal)':'var(--card)'};color:${tab==='colab'?'#fff':'var(--ink)'};border:1px solid var(--line);">Colaborador</button>
        <button class="btn" id="tabAdmin" style="width:auto;background:${tab==='admin'?'var(--teal)':'var(--card)'};color:${tab==='admin'?'#fff':'var(--ink)'};border:1px solid var(--line);">Administrador</button>
      </div>
      <div id="tabBody"><div class="empty">Carregando…</div></div>
    </div>
  `;
  document.getElementById('tabColab').onclick = ()=> renderStartScreen('colab');
  document.getElementById('tabAdmin').onclick = ()=> renderStartScreen('admin');

  const body = document.getElementById('tabBody');

  if(tab === 'colab'){
    const employees = await getEmployees();
    if(!employees.length){
      body.innerHTML = `<div class="empty">Nenhum colaborador cadastrado ainda. Peça para um administrador te cadastrar no painel admin.</div>`;
      return;
    }
    body.innerHTML = `
      <select id="colabName">
        <option value="">Selecione seu nome</option>
        ${employees.map(e=>`<option value="${e.name}">${e.name}</option>`).join('')}
      </select>
      <input id="colabPin" type="password" placeholder="Sua senha de 4 dígitos" maxlength="4" inputmode="numeric">
      <div class="err" id="colabErr"></div>
      <button class="btn" id="doColabLogin">Entrar</button>
    `;
    wirePinOnly(document.getElementById('colabPin'));
    document.getElementById('doColabLogin').onclick = async ()=>{
      const name = document.getElementById('colabName').value;
      const pin = document.getElementById('colabPin').value;
      const errEl = document.getElementById('colabErr');
      if(!name){ errEl.textContent = 'Selecione seu nome.'; return; }
      const btnEl = document.getElementById('doColabLogin');
      btnEl.disabled = true; btnEl.textContent = 'Entrando…';
      try{
        await signInEmployee(name, pin);
        setMyName(name);
        renderMain();
      }catch(e){
        errEl.textContent = 'Senha incorreta.';
        btnEl.disabled = false; btnEl.textContent = 'Entrar';
      }
    };
    return;
  }

  body.innerHTML = `
    <select id="adminName">
      <option value="">Selecione seu nome</option>
      ${ADMIN_NAMES.map(n=>`<option value="${n}">${n}</option>`).join('')}
    </select>
    <div id="adminPinArea"></div>
    <div class="err" id="adminErr"></div>
    <button class="btn" id="doAdminLogin" style="background:var(--ink);" disabled>Selecione seu nome</button>
  `;
  const adminNameSel = document.getElementById('adminName');
  const submitBtn = document.getElementById('doAdminLogin');

  async function renderPinArea(){
    const name = adminNameSel.value;
    const pinArea = document.getElementById('adminPinArea');
    if(!name){ pinArea.innerHTML = ''; submitBtn.disabled = true; submitBtn.textContent='Selecione seu nome'; return; }
    pinArea.innerHTML = `<div class="empty">Verificando…</div>`;
    const hasAccount = await adminHasAccount(name);
    if(!hasAccount){
      pinArea.innerHTML = `
        <p class="hint" style="margin:0 0 10px;">Primeiro acesso de ${name}: crie uma senha de 4 dígitos.</p>
        <input id="adminPinNew" type="password" placeholder="Crie uma senha de 4 dígitos" maxlength="4" inputmode="numeric">
        <input id="adminPinNew2" type="password" placeholder="Confirme a senha" maxlength="4" inputmode="numeric">
      `;
      wirePinOnly(document.getElementById('adminPinNew'));
      wirePinOnly(document.getElementById('adminPinNew2'));
      submitBtn.textContent = 'Criar senha e entrar';
    } else {
      pinArea.innerHTML = `<input id="adminPinLogin" type="password" placeholder="Senha de 4 dígitos" maxlength="4" inputmode="numeric">`;
      wirePinOnly(document.getElementById('adminPinLogin'));
      submitBtn.textContent = 'Entrar';
    }
    submitBtn.disabled = false;
  }
  adminNameSel.onchange = renderPinArea;

  submitBtn.onclick = async ()=>{
    const name = adminNameSel.value;
    const errEl = document.getElementById('adminErr');
    if(!name){ errEl.textContent = 'Selecione seu nome.'; return; }
    submitBtn.disabled = true;
    const hasAccount = await adminHasAccount(name);
    if(!hasAccount){
      const p1 = document.getElementById('adminPinNew').value;
      const p2 = document.getElementById('adminPinNew2').value;
      if(p1.length!==4){ errEl.textContent = 'A senha precisa ter 4 dígitos.'; submitBtn.disabled=false; return; }
      if(p1!==p2){ errEl.textContent = 'As senhas não coincidem.'; submitBtn.disabled=false; return; }
      try{
        await createAdminAccount(name, p1);
        renderAdmin();
      }catch(e){
        console.error(e);
        errEl.textContent = 'Não foi possível criar a senha. Tente novamente.';
        submitBtn.disabled = false;
      }
      return;
    }
    const pin = document.getElementById('adminPinLogin').value;
    try{
      await signInAdmin(name, pin);
      renderAdmin();
    }catch(e){
      errEl.textContent = 'Senha incorreta.';
      submitBtn.disabled = false;
    }
  };
}

function onlyDigits(v){ return (v||'').replace(/\D/g,''); }
function wirePinOnly(input){
  input.addEventListener('input', ()=>{ input.value = onlyDigits(input.value).slice(0,4); });
}

// ===== TELA DO COLABORADOR =====
async function renderMain(){
  const myName = getMyName();
  if(!myName){ renderStartScreen('colab'); return; }

  const dateKey = todayKey();
  let punches = await getPunches(dateKey);

  const { mine, lastType } = computeStatus(punches, myName);
  const nextAction = NEXT_ACTION[lastType];

  app.innerHTML = `
    <header>
      <div class="brand"><img src="ibgp-logo.png" alt="IBGP"> Ponto da equipe</div>
      <div class="clock mono" id="liveClock">${fmtClock()}</div>
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="admin-link" id="openAdmin">Painel admin</div>
        <div class="who" id="switchId">${myName} · trocar</div>
      </div>
    </header>

    <div class="card punch-zone" style="max-width:320px;margin:0 auto;">
      <div style="font-size:12px;color:var(--muted);text-transform:capitalize;">${fmtDatePretty()}</div>
      ${nextAction ? `
        <button class="punch-btn ${nextAction==='saida'?'saida':''}" id="punchBtn">${BTN_LABEL[nextAction]}</button>
      ` : `
        <div class="punch-btn done">Dia encerrado</div>
      `}
      <div class="stamp" id="stampMsg"></div>
      <div class="timeline">
        <h3>Seu dia</h3>
        ${mine.length ? mine.map(p=>`
          <div class="tl-item"><span>${TYPES[p.type]}</span><span class="time">${fmtTime(p.time)}</span></div>
        `).join('') : `<div class="empty">Nenhum registro ainda hoje.</div>`}
      </div>
    </div>
  `;

  document.getElementById('switchId').onclick = async ()=>{
    try{ await auth.signOut(); }catch(e){}
    setMyName(null);
    renderStartScreen('colab');
  };

  document.getElementById('openAdmin').onclick = ()=> renderStartScreen('admin');

  const btn = document.getElementById('punchBtn');
  if(btn){
    btn.onclick = async ()=>{
      btn.disabled = true;
      try{
        await addOwnPunch(dateKey, myName, nextAction);
        document.getElementById('stampMsg').textContent = TYPES[nextAction]+' registrada agora.';
      }catch(e){
        console.error(e);
        document.getElementById('stampMsg').textContent = 'Não foi possível registrar. Tente novamente.';
        btn.disabled = false;
        return;
      }
      renderMain();
    };
  }

  clearInterval(window.__clockTimer);
  window.__clockTimer = setInterval(()=>{
    const c = document.getElementById('liveClock');
    if(c) c.textContent = fmtClock();
  }, 1000);
}

// ===== PAINEL ADMIN =====
async function renderAdmin(){
  clearInterval(window.__clockTimer);
  const employees = await getEmployees();
  let dates = await listPunchDates();
  const today = todayKey();
  if(!dates.includes(today)) dates = [today, ...dates];

  const allPunches = {};
  for(const d of dates){ allPunches[d] = await getPunches(d); }

  function dayLabel(d){
    const dt = new Date(d+'T00:00:00');
    let label = dt.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
    if(d === today) label += ' · hoje';
    return label;
  }

  const currentMonth = today.slice(0,7);
  const employeeNames = employees.map(e=>e.name);

  function monthlyTotals(monthKey){
    const totals = {};
    employeeNames.forEach(n=>totals[n]=0);
    Object.keys(allPunches).forEach(d=>{
      if(!d.startsWith(monthKey)) return;
      const punches = allPunches[d];
      const namesInDay = [...new Set(punches.map(p=>p.name))];
      namesInDay.forEach(name=>{
        const st = computeStatus(punches, name);
        const worked = computeWorked(st.mine);
        if(worked && !isNaN(worked) && worked>0){
          totals[name] = (totals[name]||0) + worked;
        }
      });
    });
    return totals;
  }
  function renderMonthlyRows(monthKey){
    const totals = monthlyTotals(monthKey);
    const names = Object.keys(totals).sort((a,b)=> totals[b]-totals[a]);
    if(!names.length) return '<tr><td colspan="2" class="empty">Nenhum colaborador cadastrado.</td></tr>';
    return names.map(n=>'<tr><td>'+n+'</td><td class="mono">'+fmtHours(totals[n])+'</td></tr>').join('');
  }

  app.innerHTML = `
    <header>
      <div class="brand"><img src="ibgp-logo.png" alt="IBGP"> Painel admin</div>
      <div class="clock mono">${fmtClock()}</div>
      <div class="admin-link" id="backBtn" style="color:#fff;">Voltar ao ponto</div>
    </header>

    <div class="card admin-section">
      <p class="section-title">Resumo de horas do mês</p>
      <div class="inline-form">
        <input type="month" id="monthPicker" value="${currentMonth}" style="max-width:200px;">
      </div>
      <div class="export-row">
        <button class="btn secondary" id="exportSummary">Exportar resumo (CSV)</button>
        <button class="btn secondary" id="exportDetailed">Exportar registros detalhados do mês (CSV)</button>
      </div>
      <table>
        <thead><tr><th>Colaborador</th><th class="mono">Total de horas</th></tr></thead>
        <tbody id="monthlyBody">${renderMonthlyRows(currentMonth)}</tbody>
      </table>
      <p class="hint">Soma automática das horas trabalhadas (descontando o almoço) em todos os dias do mês selecionado. Registros anulados não entram na soma. Dias em andamento contam até o horário atual.</p>
    </div>

    <div class="card admin-section">
      <p class="section-title">Adicionar registro manual (correção)</p>
      <p class="hint" style="margin-top:-6px;">Use quando um colaborador esqueceu de bater um ponto. Isso não apaga nada — cria um novo registro com o motivo explicado.</p>
      <div class="inline-form">
        <select id="corrName">
          <option value="">Colaborador</option>
          ${employees.map(e=>`<option value="${e.name}" data-uid="${e.uid}">${e.name}</option>`).join('')}
        </select>
        <select id="corrType">
          <option value="entrada">Entrada</option>
          <option value="inicio_intervalo">Início do almoço</option>
          <option value="fim_intervalo">Fim do almoço</option>
          <option value="saida">Saída</option>
        </select>
        <input type="date" id="corrDate" value="${today}">
        <input type="time" id="corrTime">
      </div>
      <div class="inline-form">
        <input id="corrReason" placeholder="Motivo da correção (obrigatório)">
        <button class="btn" id="corrSave">Adicionar</button>
      </div>
      <div class="err" id="corrErr"></div>
    </div>

    <div class="card admin-section">
      <p class="section-title">Todos os registros, por dia</p>
      <p class="hint" style="margin:-4px 0 16px;">Os horários dos colaboradores são gravados automaticamente no momento em que a pessoa bate o ponto e não podem ser editados. Nenhum registro pode ser apagado — o administrador só pode anular com um motivo, mantendo o histórico completo.</p>
      ${dates.map((d,i)=>{
        const dayPunches = allPunches[d]||[];
        const byName = {};
        dayPunches.forEach(p=>{
          if(!byName[p.name]) byName[p.name] = {};
          if(!byName[p.name][p.type] || (byName[p.name][p.type].void && !p.void)){
            byName[p.name][p.type] = p;
          }
        });
        const names = Object.keys(byName).sort((a,b)=>a.localeCompare(b,'pt-BR'));
        function cell(name, type){
          const p = byName[name][type];
          if(!p) return '<td class="mono">—</td>';
          let extra = '';
          if(p.void){
            extra = '<div class="void-note">anulado: '+(p.voidReason||'')+'</div>';
          } else {
            extra = '<button class="icon-btn" data-date="'+d+'" data-id="'+p.id+'" data-action="void">anular</button>';
            if(p.addedByAdmin) extra = '<div class="corr-note">correção: '+(p.reason||'')+'</div>' + extra;
          }
          const timeDisplay = p.void ? '<s>'+fmtTime(p.time)+'</s>' : fmtTime(p.time);
          return '<td class="mono">'+timeDisplay+'<br>'+extra+'</td>';
        }
        return '<details '+(i===0?'open':'')+' style="margin-bottom:10px;border:1px solid var(--line);border-radius:10px;padding:4px 14px;">'+
          '<summary style="cursor:pointer;padding:10px 0;font-weight:500;text-transform:capitalize;">'+dayLabel(d)+' <span style="color:var(--muted);font-weight:400;text-transform:none;">· '+names.length+' colaborador'+(names.length===1?'':'es')+'</span></summary>'+
          '<table style="margin-bottom:10px;"><thead><tr><th>Nome</th><th class="mono">Entrada</th><th class="mono">Início do almoço</th><th class="mono">Fim do almoço</th><th class="mono">Saída</th></tr></thead><tbody>'+
          (names.length ? names.map(name=>
            '<tr><td>'+name+'</td>'+cell(name,'entrada')+cell(name,'inicio_intervalo')+cell(name,'fim_intervalo')+cell(name,'saida')+'</tr>'
          ).join('') : '<tr><td colspan="5" class="empty">Nenhum registro nesse dia.</td></tr>')+
          '</tbody></table></details>';
      }).join('')}
    </div>

    <div class="card admin-section">
      <p class="section-title">Equipe cadastrada</p>
      ${employees.length ? employees.map(e=>`
        <div class="row-actions" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);">
          <span>${e.name}</span>
          <button class="icon-btn" data-remove="${e.uid}">Remover</button>
        </div>
      `).join('') : `<div class="empty">Ninguém cadastrado ainda.</div>`}
      <div class="inline-form" style="margin-top:14px;">
        <input id="newMember" placeholder="Nome da nova pessoa">
        <input id="newMemberPin" type="password" placeholder="Senha de 4 dígitos" maxlength="4" inputmode="numeric" style="max-width:180px;">
        <button class="btn" id="addMember">Adicionar</button>
      </div>
      <div class="err" id="memberErr"></div>
      <p class="hint">Só o administrador cadastra colaboradores aqui. Cada pessoa usa seu nome e essa senha para bater ponto. Remover alguém desativa o acesso, mas mantém o histórico de ponto dessa pessoa.</p>
    </div>

    <div class="card admin-section">
      <p class="section-title">Administradores</p>
      <div id="adminStatusList"><div class="empty">Verificando…</div></div>
      <p class="hint">O acesso ao painel admin é limitado a Marcela Avelar e Laryssa Fulgêncio, garantido pelas regras do banco de dados — não é possível adicionar outros administradores.</p>
    </div>
  `;

  (async ()=>{
    const rows = [];
    for(const n of ADMIN_NAMES){
      const has = await adminHasAccount(n);
      rows.push('<div class="row-actions" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);"><span>'+n+'</span><span style="color:var(--muted);font-size:12px;">'+(has?'senha definida':'ainda sem senha')+'</span></div>');
    }
    const el = document.getElementById('adminStatusList');
    if(el) el.innerHTML = rows.join('');
  })();

  document.getElementById('backBtn').onclick = async ()=>{
    try{ await auth.signOut(); }catch(e){}
    setMyName(null);
    renderStartScreen('colab');
  };

  document.getElementById('monthPicker').oninput = (e)=>{
    document.getElementById('monthlyBody').innerHTML = renderMonthlyRows(e.target.value);
  };
  document.getElementById('exportSummary').onclick = ()=>{
    const mk = document.getElementById('monthPicker').value;
    exportMonthlySummaryCSV(mk, monthlyTotals(mk));
  };
  document.getElementById('exportDetailed').onclick = ()=>{
    const mk = document.getElementById('monthPicker').value;
    exportDetailedCSV(mk, allPunches);
  };

  document.querySelectorAll('button[data-action="void"]').forEach(b=>{
    b.onclick = async ()=>{
      const reason = window.prompt('Motivo da anulação deste registro:');
      if(reason === null) return;
      if(!reason.trim()){ alert('Informe um motivo para anular o registro.'); return; }
      await voidEntry(b.dataset.date, b.dataset.id, reason.trim());
      renderAdmin();
    };
  });

  document.querySelectorAll('button[data-remove]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Remover o acesso dessa pessoa? O histórico de ponto será mantido.')) return;
      await deactivateEmployee(b.dataset.remove);
      renderAdmin();
    };
  });

  wirePinOnly(document.getElementById('newMemberPin'));
  document.getElementById('addMember').onclick = async ()=>{
    const val = document.getElementById('newMember').value.trim();
    const pin = document.getElementById('newMemberPin').value;
    const errEl = document.getElementById('memberErr');
    const btnEl = document.getElementById('addMember');
    if(!val){ errEl.textContent = 'Digite o nome.'; return; }
    if(pin.length!==4){ errEl.textContent = 'A senha precisa ter 4 dígitos.'; return; }
    btnEl.disabled = true; btnEl.textContent = 'Adicionando…';
    try{
      await addEmployee(val, pin);
      renderAdmin();
    }catch(e){
      console.error(e);
      errEl.textContent = (e.code==='auth/email-already-in-use') ? 'Já existe alguém cadastrado com esse nome.' : 'Não foi possível cadastrar. Tente novamente.';
      btnEl.disabled = false; btnEl.textContent = 'Adicionar';
    }
  };

  document.getElementById('corrSave').onclick = async ()=>{
    const sel = document.getElementById('corrName');
    const name = sel.value;
    const uid = sel.selectedOptions[0] ? sel.selectedOptions[0].dataset.uid : null;
    const type = document.getElementById('corrType').value;
    const date = document.getElementById('corrDate').value;
    const time = document.getElementById('corrTime').value;
    const reason = document.getElementById('corrReason').value.trim();
    const errEl = document.getElementById('corrErr');
    if(!name){ errEl.textContent = 'Selecione o colaborador.'; return; }
    if(!date || !time){ errEl.textContent = 'Informe data e horário.'; return; }
    if(!reason){ errEl.textContent = 'Informe o motivo da correção.'; return; }
    const isoTime = new Date(date+'T'+time+':00').toISOString();
    await addAdminCorrection(date, name, uid, type, isoTime, reason);
    renderAdmin();
  };
}

renderMain();
</script>
</body>
</html>
